name: Interpreter unit tests

on:
  push:
    branches: ["main", "learning"]
  pull_request:
    branches: ["main", "learning"]

env:
  CARGO_TERM_COLOR: always
  RUSTC_BACKTRACE: 1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
